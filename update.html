<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Study Beat 更新の復旧</title>
<style>body{font-family:system-ui,sans-serif;background:#0b1120;color:#eef2fa;max-width:560px;margin:64px auto;padding:24px;line-height:1.8}h1{font-size:26px}button{font:inherit;background:#a8f07d;color:#142315;border:0;border-radius:8px;padding:14px 22px;cursor:pointer}a{color:#a8f07d}#status{min-height:3em}</style>
<h1>Study Beat 更新の復旧</h1><p>古い画面が表示され続ける場合に、アプリの更新情報を取り直します。端末のタイミング設定と保存済み音源は残します。</p><button id="repair">最新版に切り替える</button><p id="status" role="status"></p><a href="./">ホームへ戻る</a>
<script>
document.getElementById('repair').addEventListener('click',async()=>{
 const button=document.getElementById('repair'),status=document.getElementById('status');button.disabled=true;status.textContent='最新版を取得しています…';
 try{
  const base=new URL('./',location.href),target=new URL(base);target.searchParams.set('update',Date.now());
  const response=await fetch(target,{cache:'no-store',signal:AbortSignal.timeout(10000)});
  if(!response.ok||response.headers.get('X-Study-Offline'))throw new Error('offline');
  const html=await response.text();
  if(!html.includes('id="app-version"'))throw new Error('invalid page');
  if('serviceWorker' in navigator){for(const registration of await navigator.serviceWorker.getRegistrations()){if(registration.scope===base.href)await registration.unregister();}}
  if('caches' in window){for(const key of await caches.keys()){if(/^study-beat-v\d/.test(key))await caches.delete(key);}}
  target.searchParams.set('update',Date.now());location.replace(target.href);
 }catch{status.textContent='最新版を取得できませんでした。通信を確認して、もう一度お試しください。';button.disabled=false;}
});
</script></html>
